services:
  openclaw-gateway:
    container_name: openclaw-gateway
    env_file:
    - .env
    environment:
    - OPENCLAW_ALLOW_OLDER_BINARY_DESTRUCTIVE_ACTIONS=1
    # Pin past 2026.6.11 — that build has a known
    # "reply session initialization conflicted" race (fixed in 2026.7.1+).
    # Do not float :latest until tested; Windows/Control UI share agent:main:main.
    image: ghcr.io/openclaw/openclaw:2026.7.1
    extra_hosts:
    # Reach host MCP (reclaw-platform :8100) from inside the gateway container.
    - host.docker.internal:host-gateway
    ports:
    # Control UI + gateway WS on 18789 only.
    # Do NOT publish 3000 here — host :3000 is ravenstack-fortress (Vite).
    - 18789:18789
    restart: unless-stopped
    user: 1000:1000
    volumes:
    - ./data:/data:rw
    - ~/.openclaw:/home/node/.openclaw
  reclaw-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: reclaw-api
    env_file:
    - .env
    environment:
    - RECLAW_ENV=prod
    - RECLAW_OBSIDIAN_VAULT_PATH=/vault
    - RECLAW_KNOWLEDGE_PATH=/vault/Ravenstack
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      timeout: 5s
    image: reclaw:2.0
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    ports:
    - 8000:8000
    restart: unless-stopped
    user: 1000:1000
    volumes:
    - .:/app
    - ./data:/data:rw
    - ./outputs:/app/outputs:rw
    - /root/obsidian_vault:/vault:rw
  reclaw-dashboard:
    command: python3 -m http.server 8080 --directory dashboard
    container_name: reclaw-dashboard
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/')
      timeout: 5s
    image: python:3.12-slim
    ports:
    - 8081:8080
    restart: unless-stopped
    volumes:
    - .:/app:ro
    working_dir: /app
