services:
  reclaw-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: reclaw:2.0
    container_name: reclaw-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RECLAW_ENV=prod
      - RECLAW_OBSIDIAN_VAULT_PATH=/vault
      - RECLAW_KNOWLEDGE_PATH=/vault/Ravenstack
    volumes:
      - .:/app
      - ./data:/data:rw
      - ./outputs:/app/outputs:rw
      - /root/obsidian_vault:/vault:rw
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  reclaw-dashboard:
    image: python:3.12-slim
    container_name: reclaw-dashboard
    restart: unless-stopped
    working_dir: /app
    command: python3 -m http.server 8080 --directory dashboard
    volumes:
      - .:/app:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - LOCAL_CODER_API_KEY=${LOCAL_CODER_API_KEY:-local-coder}
      # Ollama chat API (tags/models). Coder GGUF stays on :8080 separately if needed.
      - OLLAMA_HOST=http://127.0.0.1:11434
      - OLLAMA_API_BASE=http://127.0.0.1:11434
      - XAI_API_KEY=${XAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HOME=/home/node
    volumes:
      - /root/.openclaw:/home/node/.openclaw
      # Host Tailscale CLI + daemon socket (Serve is host-managed; mounts for ops/debug).
      - /usr/bin/tailscale:/usr/bin/tailscale:ro
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    # Shared netns: gateway + host Tailscale (no Docker NAT). Required for Serve→loopback.
    network_mode: host
    # Dual path (PDANet-safe):
    #   1) PRIMARY  — Tailscale Serve → wss://openclaw.tail20a090.ts.net
    #   2) FALLBACK — bind lan → :18789 on all ifaces incl. 100.108.130.82 (tailnet TCP)
    # Serve still proxies to 127.0.0.1:18789 (lan bind includes loopback).
    # Host multi-path: bash scripts/ensure-tailscale-mcp-funnel.sh
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "lan",
        "--port",
        "18789",
        "--allow-unconfigured",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
