services:
  openclaw-gateway:
    container_name: openclaw-gateway
    env_file:
    - .env
    environment:
    - OPENCLAW_ALLOW_OLDER_BINARY_DESTRUCTIVE_ACTIONS=1
    # wigolo stdio MCP (spawned by gateway): cache + Gemini for research synthesis
    - WIGOLO_DATA_DIR=/home/node/.wigolo
    - WIGOLO_LLM_PROVIDER=gemini
    - HOME=/home/node
    # Pin past 2026.6.11 session-init race (fixed in 2026.7.1+). Do not float :latest.
    image: ghcr.io/openclaw/openclaw:2026.7.1
    extra_hosts:
    # Reach host MCP (reclaw-platform :8100) from inside the gateway container.
    - host.docker.internal:host-gateway
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:18789/health
      timeout: 5s
    ports:
    # Control UI + gateway WS on 18789 only.
    # Do NOT publish 3000 here — host :3000 is ravenstack-fortress (Vite).
    - "127.0.0.1:18789:18789"
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    user: 1000:1000
    volumes:
    - ./data:/data:rw
    - ~/.openclaw:/home/node/.openclaw
    # Persist wigolo cache/models/browser engine (uid 1000).
    - /root/.wigolo:/home/node/.wigolo
    # Permanent outbox (host /root/outbox → container path agents can write).
    # Host path /root is 0700 and not traversable by uid 1000, so mount under /home/node.
    - /root/outbox:/home/node/outbox:rw
    # Obsidian app:// origin allowlist patch (re-apply after image upgrade)
    - /root/openclaw-patches/auth-B27MflKU.js:/app/dist/auth-B27MflKU.js:ro
  reclaw-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: reclaw-api
    env_file:
    - .env
    environment:
    - RECLAW_ENV=prod
    - RECLAW_OBSIDIAN_VAULT_PATH=/vault
    - RECLAW_KNOWLEDGE_PATH=/vault/Ravenstack
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      timeout: 5s
    image: reclaw:2.0
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    ports:
    # Bind localhost only. Tailscale Serve already proxies
    # https://openclaw.tail20a090.ts.net:8000 -> 127.0.0.1:8000.
    # Publishing 0.0.0.0:8000 races Tailscale after reboot (EADDRINUSE).
    - "127.0.0.1:8000:8000"
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    user: 1000:1000
    volumes:
    - .:/app
    - ./data:/data:rw
    - ./outputs:/app/outputs:rw
    - /root/obsidian_vault:/vault:rw
  reclaw-dashboard:
    command: python3 -m http.server 8080 --directory dashboard
    container_name: reclaw-dashboard
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/')
      timeout: 5s
    image: python:3.12-slim
    ports:
    # Bind localhost only. Tailscale Serve already proxies
    # https://openclaw.tail20a090.ts.net:8081 -> 127.0.0.1:8081.
    - "127.0.0.1:8081:8080"
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - .:/app:ro
    working_dir: /app
