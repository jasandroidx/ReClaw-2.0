services:
  reclaw-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: reclaw:2.0
    container_name: reclaw-api
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RECLAW_ENV=prod
      - RECLAW_OBSIDIAN_VAULT_PATH=/vault
      - RECLAW_KNOWLEDGE_PATH=/vault/Ravenstack
    volumes:
      - .:/app
      - ./data:/data:rw
      - ./outputs:/app/outputs:rw
      - /root/obsidian_vault:/vault:rw
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  reclaw-dashboard:
    image: python:3.12-slim
    container_name: reclaw-dashboard
    restart: unless-stopped
    working_dir: /app
    command: python3 -m http.server 8080 --directory dashboard
    volumes:
      - .:/app:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_HOST=http://127.0.0.1:8080
    volumes:
      - /root/.openclaw:/home/node/.openclaw
    network_mode: host
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789", "--allow-unconfigured"]