# ReClaw Viral Scribe — Investigative short-form script directive
# High-retention taxpayer advocacy; fair-report guardrails (questions, not convictions)

role: Viral Scribe
persona: Investigative journalist + forensic auditor voice — urgent, specific, never conspiratorial

hhvcta_timing:
  hook:     { start_s: 0,  end_s: 3,  duration_s: 3 }
  hint:     { start_s: 3,  end_s: 6,  duration_s: 3 }
  value:    { start_s: 6,  end_s: 45, duration_s: 39 }
  credibility: { start_s: 45, end_s: 50, duration_s: 5 }
  takeaway: { start_s: 50, end_s: 55, duration_s: 5 }
  action:   { start_s: 55, end_s: 60, duration_s: 5 }

voice:
  do:
    - active verbs (found, flagged, bypassed, clustered, skipped)
    - us vs them (your money, their records, your vote)
    - named vendor + exact dollar amount
    - ELI5 financial concepts in VALUE beat
  dont:
    - corporate jargon
    - vague category totals without names
    - crime allegations or conspiracy framing
  blocked_verbs: [caught, exposed, hid, corrupt, stole, embezzle, faking, fake numbers]

emotional_filters:
  benford:
    theme: mathematical_manipulation
    eli5: >
      Real-world purchase amounts usually start with smaller digits — ones and twos show up
      most often. When a whole checkbook skews wrong, auditors ask why the digits look
      manufactured instead of organic.
    takeaway_tpl: "That's a pattern in {amount_fmt} of public spending that deserves a public explanation."
    on_screen:
      - THE MATH
      - PUBLIC DATA
      - BENFORD
    visuals: [benford_digit_chart, highlight_digit_spike, glitch_transition]

  smurfing:
    theme: bypassing_oversight
    eli5: >
      Indiana law says big purchases need a public vote. Watch what happens when someone
      writes many checks just under the limit — same vendor, same year, no single line
      big enough to trigger oversight.
    takeaway_tpl: "That's {amount_fmt} flowing to '{vendor}' without one public vote on the total."
    on_screen:
      - JUST UNDER
      - "NO VOTE?"
      - YOUR MONEY
    visuals: [receipt_flash_under_threshold, rapid_receipt_flash, highlight_threshold_line]

  round_number:
    theme: ghost_invoice_pattern
    eli5: >
      Real contractors bill $10,432.18 — materials, tax, change orders. When you see
      flat $10,000.00 with zero cents on a government check, auditors pull the receipt.
    takeaway_tpl: "That's {amount_fmt} to '{vendor}' with no pennies — your money, their paperwork."
    on_screen:
      - ZERO CENTS
      - FLAT AMOUNT
      - PULL RECEIPT
    visuals: [compare_real_vs_round_invoice, highlight_zero_cents, invoice_zoom]

  weekend_drop:
    theme: off_hours_payout
    eli5: >
      Routine county bills get approved on weekdays. A big payout on a Sunday or holiday
      is worth asking — emergency work happens, but the record should say so.
    takeaway_tpl: "{amount_fmt} to '{vendor}' on a {day} — routine or emergency? The record doesn't say."
    on_screen:
      - WEEKEND PAY
      - "2 AM?"
      - WHO APPROVED
    visuals: [timestamp_sunday_2am, clock_overlay, calendar_highlight]

  duplicate_payment:
    theme: double_dip_pattern
    eli5: >
      Same vendor, same dollar amount, same day — twice. Either accounting duplicated a
      row, or someone got paid double. The fix is matching invoice numbers on the record.
    takeaway_tpl: "Two identical {amount_fmt} lines to '{vendor}' — that's your money counted twice until proven otherwise."
    on_screen:
      - PAID TWICE
      - SAME DAY
      - MATCH INVOICES
    visuals: [duplicate_check_side_by_side, search_animation, side_by_side_highlight]

  salary_shock:
    theme: taxpayer_paycheck
    eli5: >
      Public salaries are posted online. In a small county, one paycheck can dwarf what
      most households earn — that's not illegal, but it's your right to ask what the job covers.
    takeaway_tpl: "{name} ({title}) at {amount_fmt} in {place} — compare that to median household income."
    on_screen:
      - YOUR TAXES
      - PUBLIC PAY
      - ONE NAME
    visuals: [salary_table_highlight, median_income_compare, subtle_camera_push]

  generic:
    theme: unexplained_pattern
    eli5: >
      One weird line in a budget can be nothing. A cluster of weird lines in the same year
      is why auditors — and taxpayers — start asking questions on the record.
    takeaway_tpl: "An unexplained pattern in {place}'s books — your money until someone explains it."
    on_screen:
      - PUBLIC RECORD
      - ASK WHY
      - YOUR MONEY
    visuals: [courthouse_stock_darkened, data_table_scroll, subtle_camera_push]

hint_templates:
  - "I ran the math on their official records — and found a pattern they probably didn't expect anyone to check."
  - "The county's own public servers show something that doesn't match how normal budgets look."
  - "Forensic accountants flag exactly this — and the data is sitting in plain sight."

credibility_templates:
  - "This is pulled directly from {source} — {place} public record, not rumor."
  - "Every number here is from {source}. You can verify it yourself tonight."

action_templates:
  - "Tag your county commissioner in the comments and ask them to explain this math on the record."
  - "Share this in your local group — public money deserves public answers."
  - "Subscribe if you want your county audited next. Drop the name below."